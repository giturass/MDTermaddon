// Preserve all upstream SDK, branding, dependency and optimization settings.
def requiredEnvironment = { String name ->
    def value = System.getenv(name)
    if (value == null || value.isEmpty()) {
        throw new GradleException("Missing required environment variable: " + name)
    }
    value
}

def selectedStore = new File(requiredEnvironment("MDTERM_ADDON_STORE_FILE"))
if (!selectedStore.isAbsolute() || !selectedStore.isFile()) {
    throw new GradleException("MDTERM_ADDON_STORE_FILE must name an existing absolute keystore path")
}
def selectedStorePassword = requiredEnvironment("MDTERM_ADDON_STORE_PASSWORD")
def selectedKeyAlias = requiredEnvironment("MDTERM_ADDON_KEY_ALIAS")
def selectedKeyPassword = requiredEnvironment("MDTERM_ADDON_KEY_PASSWORD")

if (android.defaultConfig.applicationId != mdtermAddonApplicationId ||
        android.namespace != mdtermAddonNamespace) {
    throw new GradleException("Upstream applicationId or namespace does not match sources.lock.json")
}

android {
    signingConfigs {
        mdtermAddon {
            storeFile selectedStore
            storePassword selectedStorePassword
            keyAlias selectedKeyAlias
            keyPassword selectedKeyPassword
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.mdtermAddon
        }
    }
}

// Supported by both AGP 8 and 9. X11 exposes only sharedUidRelease.
androidComponents {
    beforeVariants(selector().all()) { variant ->
        variant.enable = variant.buildType == 'release' &&
                (mdtermAddonFlavor.isEmpty() || variant.productFlavors.any {
                    it.second == mdtermAddonFlavor
                })
    }
}
